<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Add Subject Marks | BIM Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- SheetJS for Excel export/import -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #eef2f9 0%, #e2e8f0 100%);
            font-family: 'Inter', sans-serif;
            padding: 2rem 1.5rem;
            color: #0a2540;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e3c72, #2b4c7c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .back-link {
            background: rgba(44, 110, 158, 0.1);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            text-decoration: none;
            color: #1e4a76;
            font-weight: 500;
            font-size: 0.9rem;
            transition: 0.2s;
            border: 1px solid rgba(44, 110, 158, 0.25);
        }
        .back-link i { margin-right: 6px; }
        .back-link:hover { background: rgba(44, 110, 158, 0.2); transform: translateY(-2px); }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 1.8rem;
            padding: 1.8rem;
            margin-bottom: 2rem;
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .step-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            align-items: flex-end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex: 1;
            min-width: 180px;
        }
        label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1f4e79;
        }
        select, input {
            padding: 0.75rem 1rem;
            border: 1px solid #cfdfed;
            border-radius: 1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            background: white;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #2c6e9e;
            box-shadow: 0 0 0 3px rgba(44, 110, 158, 0.2);
        }
        .warning-msg, .info-msg {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            margin-bottom: 1.2rem;
            color: #856404;
            font-size: 0.85rem;
        }
        .info-msg { background: #e6f4ea; border-left-color: #2e7d32; color: #1e4a2f; }
        .marks-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .marks-table th, .marks-table td {
            padding: 0.9rem 0.6rem;
            text-align: left;
            border-bottom: 1px solid #e2edf5;
            vertical-align: middle;
        }
        .marks-table th {
            background: #f8fafc;
            font-weight: 700;
            color: #1f4e79;
        }
        .marks-table input {
            width: 100px;
            padding: 0.5rem;
            text-align: center;
        }
        .student-name {
            font-weight: 600;
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .btn-icon {
            background: #eef2f9;
            border: 1px solid #cbdde9;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.15s;
        }
        .btn-icon:hover { background: #e2e8f0; transform: translateY(-1px); }
        .btn-primary-sm {
            background: #1f4e79;
            color: white;
            border: none;
        }
        .btn-primary-sm:hover { background: #0f3b5e; }
        .auto-save-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e6f4ea;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #2e7d32;
        }
        .empty-row td { text-align: center; padding: 2rem; color: #7c8ea0; }
        .toast-msg {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: #1f2e3e;
            color: white;
            padding: 0.7rem 1.4rem;
            border-radius: 40px;
            font-size: 0.85rem;
            z-index: 1000;
            backdrop-filter: blur(8px);
            background: rgba(15, 35, 50, 0.92);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .toast-msg.show { opacity: 1; }
        @media (max-width: 680px) {
            body { padding: 1rem; }
            .marks-table input { width: 70px; }
        }
        /* file input hidden */
        #importFileInput { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1><i class="fas fa-pen-ruler"></i> ADD SUBJECT MARKS</h1>
        <a href="marklist.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Marklist</a>
    </div>

    <!-- Step 1 + Step 2 -->
    <div class="card">
        <div style="margin-bottom: 1rem;">
            <h3 style="font-weight: 600;"><i class="fas fa-stairs"></i> 1st: Choose Class &nbsp;&nbsp; | &nbsp;&nbsp; 2nd: Choose Subject</h3>
        </div>
        <div class="step-row">
            <div class="form-group">
                <label><i class="fas fa-school"></i> CLASS</label>
                <select id="classSelect">
                    <option value="">-- Select Class --</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-book"></i> SUBJECT</label>
                <select id="subjectSelect">
                    <option value="">-- Select Subject --</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-calendar"></i> YEAR</label>
                <input type="text" id="yearInput" value="2026">
            </div>
            <div class="form-group">
                <label><i class="fas fa-clock"></i> TERM</label>
                <select id="termSelect">
                    <option value="ONE">TERM ONE</option>
                    <option value="TWO">TERM TWO</option>
                    <option value="THREE">TERM THREE</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Step 3: Marks entry table + Export/Import -->
    <div class="card" id="marksCard" style="display: none;">
        <div class="action-bar">
            <h3 style="font-weight: 600;"><i class="fas fa-table-list"></i> 3rd: Enter Marks (Paper one & Paper two)</h3>
            <div style="display: flex; gap: 0.8rem;">
                <button id="exportBtn" class="btn-icon"><i class="fas fa-download"></i> Export to Excel</button>
                <button id="importBtn" class="btn-icon"><i class="fas fa-upload"></i> Import from Excel</button>
                <span class="auto-save-badge"><i class="fas fa-save"></i> Auto-saved</span>
            </div>
        </div>
        <div id="tableContainer">
            <div class="warning-msg" id="noStudentsMsg" style="display: none;">⚠️ No students found in this class who take the selected subject.</div>
            <table class="marks-table" id="marksTable" style="display: none;">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Student Name</th>
                        <th>Subject</th>
                        <th>Paper 1 Mark</th>
                        <th>Paper 2 Mark</th>
                    </tr>
                </thead>
                <tbody id="marksTableBody"></tbody>
            </table>
        </div>
    </div>
    <!-- hidden file input for import -->
    <input type="file" id="importFileInput" accept=".xlsx, .xls, .csv, .xlsm">
</div>

<div id="toastMsg" class="toast-msg"><i class="fas fa-check-circle"></i> <span id="toastText">Saved</span></div>

<script>
    // ---------- Data & Storage ----------
    let students = [];            // from bim_students
    let availableSubjects = [];   // from bim_subjects (subject names)
    let marksStore = [];           // array: { studentId, studentName, className, subject, year, term, paper1, paper2 }

    // DOM elements
    const classSelect = document.getElementById('classSelect');
    const subjectSelect = document.getElementById('subjectSelect');
    const yearInput = document.getElementById('yearInput');
    const termSelect = document.getElementById('termSelect');
    const marksCard = document.getElementById('marksCard');
    const marksTable = document.getElementById('marksTable');
    const marksTableBody = document.getElementById('marksTableBody');
    const noStudentsMsg = document.getElementById('noStudentsMsg');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFileInput = document.getElementById('importFileInput');

    // Toast
    const toastEl = document.getElementById('toastMsg');
    const toastTextSpan = document.getElementById('toastText');
    let saveTimeout = null;
    function showToast(msg, isError = false) {
        toastTextSpan.innerText = msg;
        toastEl.classList.add('show');
        const icon = toastEl.querySelector('i');
        icon.className = isError ? 'fas fa-exclamation-triangle' : 'fas fa-check-circle';
        setTimeout(() => toastEl.classList.remove('show'), 2500);
    }

    // Load data from localStorage
    function loadData() {
        const storedStudents = localStorage.getItem('bim_students');
        students = storedStudents ? JSON.parse(storedStudents) : [];
        
        const storedSubjects = localStorage.getItem('bim_subjects');
        if (storedSubjects) {
            const subs = JSON.parse(storedSubjects);
            availableSubjects = subs.map(s => s.name).filter(n => n && n.trim());
        } else {
            availableSubjects = [];
        }
        
        const storedMarks = localStorage.getItem('bim_subject_marks');
        marksStore = storedMarks ? JSON.parse(storedMarks) : [];
        
        populateClassDropdown();
        populateSubjectDropdown();
        // if class/subject already selected, refresh table
        if (classSelect.value && subjectSelect.value && yearInput.value.trim()) {
            renderMarksTable();
        } else {
            marksCard.style.display = 'none';
        }
    }

    function populateClassDropdown() {
        const classes = [...new Set(students.map(s => s.className).filter(c => c && c.trim()))];
        classSelect.innerHTML = '<option value="">-- Select Class --</option>';
        classes.forEach(cls => {
            const option = document.createElement('option');
            option.value = cls;
            option.textContent = cls;
            classSelect.appendChild(option);
        });
        if (classes.length === 0) {
            classSelect.innerHTML = '<option value="">No classes found (add students first)</option>';
        }
    }

    function populateSubjectDropdown() {
        subjectSelect.innerHTML = '<option value="">-- Select Subject --</option>';
        availableSubjects.forEach(subj => {
            const option = document.createElement('option');
            option.value = subj;
            option.textContent = subj;
            subjectSelect.appendChild(option);
        });
        if (availableSubjects.length === 0) {
            subjectSelect.innerHTML = '<option value="">No subjects found (add in Subject Management)</option>';
        }
    }

    function getEligibleStudents(className, subjectName) {
        return students.filter(s => s.className === className && s.subjects && s.subjects.includes(subjectName));
    }

    function getMarkEntry(studentId, subject, year, term) {
        return marksStore.find(m => m.studentId === studentId && m.subject === subject && m.year === year && m.term === term);
    }

    function saveMarkEntry(studentId, studentName, className, subject, year, term, paper1, paper2) {
        const existingIndex = marksStore.findIndex(m => m.studentId === studentId && m.subject === subject && m.year === year && m.term === term);
        const entry = { studentId, studentName, className, subject, year, term, paper1: paper1 !== undefined ? paper1 : null, paper2: paper2 !== undefined ? paper2 : null };
        if (existingIndex !== -1) {
            marksStore[existingIndex] = entry;
        } else {
            marksStore.push(entry);
        }
        localStorage.setItem('bim_subject_marks', JSON.stringify(marksStore));
    }

    // Render the marks table
    function renderMarksTable() {
        const selectedClass = classSelect.value;
        const selectedSubject = subjectSelect.value;
        const year = yearInput.value.trim();
        const term = termSelect.value;
        
        if (!selectedClass || !selectedSubject || !year) {
            marksCard.style.display = 'none';
            return;
        }
        
        const eligibleStudents = getEligibleStudents(selectedClass, selectedSubject);
        if (eligibleStudents.length === 0) {
            marksCard.style.display = 'block';
            marksTable.style.display = 'none';
            noStudentsMsg.style.display = 'block';
            return;
        }
        
        marksCard.style.display = 'block';
        marksTable.style.display = 'table';
        noStudentsMsg.style.display = 'none';
        
        marksTableBody.innerHTML = '';
        eligibleStudents.forEach((student, idx) => {
            const existingMark = getMarkEntry(student.id, selectedSubject, year, term);
            const paper1Val = existingMark?.paper1 !== undefined && existingMark?.paper1 !== null ? existingMark.paper1 : '';
            const paper2Val = existingMark?.paper2 !== undefined && existingMark?.paper2 !== null ? existingMark.paper2 : '';
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${idx + 1}</td>
                <td class="student-name">${escapeHtml(student.name)}</td>
                <td>${escapeHtml(selectedSubject)}</td>
                <td><input type="number" step="0.01" min="0" max="100" class="paper1-input" data-student-id="${student.id}" data-student-name="${escapeHtml(student.name)}" value="${paper1Val}" placeholder="Paper 1"></td>
                <td><input type="number" step="0.01" min="0" max="100" class="paper2-input" data-student-id="${student.id}" data-student-name="${escapeHtml(student.name)}" value="${paper2Val}" placeholder="Paper 2"></td>
            `;
            marksTableBody.appendChild(row);
        });
        
        // Auto-save listeners
        document.querySelectorAll('.paper1-input, .paper2-input').forEach(input => {
            input.removeEventListener('input', autoSaveHandler);
            input.addEventListener('input', autoSaveHandler);
        });
    }
    
    function autoSaveHandler(e) {
        const input = e.target;
        const row = input.closest('tr');
        const studentId = parseInt(input.dataset.studentId);
        const studentName = input.dataset.studentName;
        const paper1Input = row.querySelector('.paper1-input');
        const paper2Input = row.querySelector('.paper2-input');
        const paper1 = paper1Input.value === '' ? null : parseFloat(paper1Input.value);
        const paper2 = paper2Input.value === '' ? null : parseFloat(paper2Input.value);
        const selectedClass = classSelect.value;
        const selectedSubject = subjectSelect.value;
        const year = yearInput.value.trim();
        const term = termSelect.value;
        
        saveMarkEntry(studentId, studentName, selectedClass, selectedSubject, year, term, paper1, paper2);
        if (saveTimeout) clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => showToast('Marks auto-saved ✓'), 400);
    }
    
    // Export current table to Excel (XLSX)
    function exportToExcel() {
        const selectedClass = classSelect.value;
        const selectedSubject = subjectSelect.value;
        const year = yearInput.value.trim();
        const term = termSelect.value;
        if (!selectedClass || !selectedSubject) {
            showToast('Select class and subject first', true);
            return;
        }
        const eligible = getEligibleStudents(selectedClass, selectedSubject);
        if (eligible.length === 0) {
            showToast('No students to export', true);
            return;
        }
        const data = [];
        data.push(['Student Name', 'Subject', 'Year', 'Term', 'Paper 1 Mark', 'Paper 2 Mark']);
        eligible.forEach(student => {
            const mark = getMarkEntry(student.id, selectedSubject, year, term);
            data.push([
                student.name,
                selectedSubject,
                year,
                term,
                mark?.paper1 !== undefined && mark?.paper1 !== null ? mark.paper1 : '',
                mark?.paper2 !== undefined && mark?.paper2 !== null ? mark.paper2 : ''
            ]);
        });
        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'SubjectMarks');
        XLSX.writeFile(wb, `${selectedSubject}_${selectedClass}_${year}_${term}_marks.xlsx`);
        showToast('Export complete');
    }
    
    // Import: read file and update marks based on Student Name + Subject + Year + Term
    function importFromExcel(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
            if (!rows || rows.length < 2) {
                showToast('File is empty or invalid', true);
                return;
            }
            const headers = rows[0];
            // find columns: we expect Student Name, Paper 1 Mark, Paper 2 Mark (case insensitive)
            let nameColIdx = -1, paper1Idx = -1, paper2Idx = -1;
            headers.forEach((h, idx) => {
                const str = String(h).toLowerCase();
                if (str.includes('student') && str.includes('name')) nameColIdx = idx;
                if (str.includes('paper 1') || (str.includes('paper1'))) paper1Idx = idx;
                if (str.includes('paper 2') || (str.includes('paper2'))) paper2Idx = idx;
            });
            if (nameColIdx === -1) {
                showToast('Missing "Student Name" column', true);
                return;
            }
            const selectedClass = classSelect.value;
            const selectedSubject = subjectSelect.value;
            const year = yearInput.value.trim();
            const term = termSelect.value;
            if (!selectedClass || !selectedSubject) {
                showToast('Select class and subject before import', true);
                return;
            }
            const eligibleStudents = getEligibleStudents(selectedClass, selectedSubject);
            let updatedCount = 0;
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length === 0) continue;
                const studentNameRaw = row[nameColIdx] ? String(row[nameColIdx]).trim() : '';
                if (!studentNameRaw) continue;
                const student = eligibleStudents.find(s => s.name.toLowerCase() === studentNameRaw.toLowerCase());
                if (!student) continue;
                let paper1 = (paper1Idx !== -1 && row[paper1Idx] !== undefined && row[paper1Idx] !== '') ? parseFloat(row[paper1Idx]) : null;
                let paper2 = (paper2Idx !== -1 && row[paper2Idx] !== undefined && row[paper2Idx] !== '') ? parseFloat(row[paper2Idx]) : null;
                if (isNaN(paper1)) paper1 = null;
                if (isNaN(paper2)) paper2 = null;
                saveMarkEntry(student.id, student.name, selectedClass, selectedSubject, year, term, paper1, paper2);
                updatedCount++;
            }
            renderMarksTable();
            showToast(`Imported successfully. Updated ${updatedCount} student(s).`);
        };
        reader.onerror = () => showToast('Error reading file', true);
        reader.readAsArrayBuffer(file);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    function onSelectionChange() {
        if (classSelect.value && subjectSelect.value && yearInput.value.trim()) {
            renderMarksTable();
        } else {
            marksCard.style.display = 'none';
        }
    }
    
    classSelect.addEventListener('change', onSelectionChange);
    subjectSelect.addEventListener('change', onSelectionChange);
    yearInput.addEventListener('input', onSelectionChange);
    termSelect.addEventListener('change', onSelectionChange);
    
    exportBtn.addEventListener('click', exportToExcel);
    importBtn.addEventListener('click', () => importFileInput.click());
    importFileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            importFromExcel(e.target.files[0]);
            importFileInput.value = ''; // allow re-upload same file
        }
    });
    
    loadData();
    window.addEventListener('storage', (e) => {
        if (e.key === 'bim_students' || e.key === 'bim_subjects' || e.key === 'bim_subject_marks') {
            loadData();
            onSelectionChange();
        }
    });
</script>
</body>
</html>
