<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOD'S PLAN PHONE CENTER – BUTANSI Dashboard</title>
  <style>
    /* ===== General Styles ===== */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    
    /* ===== Header ===== */
    header {
      background: linear-gradient(90deg, #4CAF50, #81C784);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    /* ===== Form Styles ===== */
    .item-form {
      background: white;
      max-width: 700px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .item-form input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    
    .item-form button {
      padding: 12px 20px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      color: white;
    }
    
    .btn-add { background-color: #4CAF50; }
    
    /* ===== Item Grid ===== */
    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 10px;
    }
    
    /* ===== Item Card ===== */
    .item-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 15px;
    }
    
    .item-card img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 5px;
    }
    
    .item-card h3 {
      margin: 10px 0 5px 0;
    }
    
    .item-card p {
      margin: 5px 0;
    }
    
    /* ===== Card Buttons ===== */
    .item-card button {
      margin: 5px;
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      color: white;
    }
    
    .btn-sell { background-color: #f44336; }      /* Red */
    .btn-add-stock { background-color: #2196F3; } /* Blue */
    .btn-delete { background-color: #9C27B0; }    /* Purple */
  </style>
</head>
<body>
  
  <header>
    GOD'S PLAN PHONE CENTER – BUTANSI
  </header>
  
  <!-- ===== Add Item Form ===== -->
  <div class="item-form">
    <h2>Add New Item</h2>
    <input type="text" id="itemName" placeholder="Item Name (e.g., Samsung A14)">
    <input type="number" id="itemMinPrice" placeholder="Minimum Price">
    <input type="number" id="itemMaxPrice" placeholder="Maximum Price">
    <input type="number" id="itemStock" placeholder="Stock Quantity">
    <input type="url" id="itemPhoto" placeholder="Photo URL (optional)">
    <button class="btn-add" onclick="addItem()">Add Item</button>
  </div>
  
  <!-- ===== Item Display Grid ===== -->
  <div class="item-grid" id="itemGrid">
    <!-- Items will appear here -->
  </div>
  
  <script>
    // ===== Persistent Storage =====
    let items = JSON.parse(localStorage.getItem('gpItems')) || [];
    
    // ===== Default Placeholder Image =====
    const placeholder = 'https://via.placeholder.com/150?text=No+Image';
    
    // ===== Display Items =====
    function displayItems() {
      const grid = document.getElementById('itemGrid');
      grid.innerHTML = '';
      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <img src="${item.photo || placeholder}" alt="${item.name}">
          <h3>${item.name}</h3>
          <p>Price: ${item.minPrice} - ${item.maxPrice}</p>
          <p>Stock: <span id="stock-${index}">${item.stock}</span></p>
          <div>
            <button class="btn-sell" onclick="sellItem(${index})">Sell</button>
            <button class="btn-add-stock" onclick="increaseStock(${index})">Add Stock</button>
            <button class="btn-delete" onclick="deleteItem(${index})">Delete</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }
    
    // ===== Add Item =====
    function addItem() {
      const name = document.getElementById('itemName').value.trim();
      const minPrice = document.getElementById('itemMinPrice').value;
      const maxPrice = document.getElementById('itemMaxPrice').value;
      const stock = document.getElementById('itemStock').value;
      const photo = document.getElementById('itemPhoto').value.trim();
      
      // ===== Validation =====
      if(!name || !minPrice || !maxPrice || !stock) {
        alert('Please fill in all required fields.');
        return;
      }
      
      if(Number(minPrice) > Number(maxPrice)) {
        alert('Minimum price cannot be greater than maximum price.');
        return;
      }
      
      const newItem = {
        name,
        minPrice: Number(minPrice),
        maxPrice: Number(maxPrice),
        stock: Number(stock),
        photo: photo || placeholder
      };
      
      items.push(newItem);
      localStorage.setItem('gpItems', JSON.stringify(items));
      displayItems();
      
      // Clear form
      document.getElementById('itemName').value = '';
      document.getElementById('itemMinPrice').value = '';
      document.getElementById('itemMaxPrice').value = '';
      document.getElementById('itemStock').value = '';
      document.getElementById('itemPhoto').value = '';
    }
    
    // ===== Sell Item =====
    function sellItem(index) {
      if(items[index].stock > 0) {
        items[index].stock -= 1;
        localStorage.setItem('gpItems', JSON.stringify(items));
        document.getElementById(`stock-${index}`).textContent = items[index].stock;
      } else {
        alert('Stock is already zero.');
      }
    }
    
    // ===== Increase Stock =====
    function increaseStock(index) {
      const add = prompt('Enter quantity to add:');
      if(add && !isNaN(add) && Number(add) > 0) {
        items[index].stock += Number(add);
        localStorage.setItem('gpItems', JSON.stringify(items));
        document.getElementById(`stock-${index}`).textContent = items[index].stock;
      } else {
        alert('Invalid quantity.');
      }
    }
    
    // ===== Delete Item =====
    function deleteItem(index) {
      const password = prompt('Enter password to delete item:');
      if(password === 'FORGIVE') {
        items.splice(index, 1);
        localStorage.setItem('gpItems', JSON.stringify(items));
        displayItems();
      } else {
        alert('Incorrect password. Deletion blocked.');
      }
    }
    
    // ===== Initial Display =====
    displayItems();
  </script>
</body>
</html>
